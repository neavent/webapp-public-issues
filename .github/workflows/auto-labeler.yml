name: Auto Labeler (Type Assignment)

on:
  issues:
    types: [opened, edited]

jobs:
  assign_type:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign Type Label based on Title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toUpperCase();
            const issue_number = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            let typeLabel = null;

            if (title.startsWith('BUG:')) {
              typeLabel = 'bug';
            } else if (title.startsWith('FEAT:')) {
              typeLabel = 'feature';
            } else if (title.startsWith('SEC:')) {
              typeLabel = 'security'; 
            }

            if (typeLabel) {
              
              const currentLabels = context.payload.issue.labels.map(l => l.name);
              if (!currentLabels.includes(typeLabel)) {
                
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [typeLabel]
                });
                console.log(`Type '${typeLabel}' wurde basierend auf dem Titel zugewiesen.`);
              }
            }
